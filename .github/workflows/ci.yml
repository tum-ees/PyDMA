name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m black --check src tests doc
      - run: python -m isort --check-only src tests doc
      - run: python -m ruff check src tests doc
      - run: python -m mypy src/pydma

  tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - if: matrix.python-version == '3.10'
        run: python -m pip install numpy==1.26.0 scipy==1.11.4 pandas==2.1.1 matplotlib==3.8.0 statsmodels==0.14.0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --override-ini="addopts=" -q -m "not scientific"
      - if: matrix.python-version == '3.10'
        run: python -m pytest --override-ini="addopts=" -q -m scientific

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
