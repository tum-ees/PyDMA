[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydma"
dynamic = ["version"]
description = "Battery Degradation Mode Analysis - Python implementation of TUM-EES DegradationModeAnalysis"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "TUM-EES", email = "mathias.rehm@tum.de"},
]
maintainers = [
    {name = "TUM-EES", email = "mathias.rehm@tum.de"},
]
keywords = [
    "battery",
    "degradation",
    "lithium-ion",
    "sodium-ion",
    "OCV",
    "DVA",
    "ICA",
    "electrochemistry",
    "aging",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.4",
    "pandas>=2.1.1",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black==25.1.0",
    "isort==5.13.2",
    "ruff>=0.15.21,<0.16",
    "pre-commit>=3.0.0",
    "mypy>=1.0.0",
    "build>=1.4.0",
    "twine>=6.2.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/tum-ees/pydma"
Documentation = "https://github.com/tum-ees/pydma#readme"
Repository = "https://github.com/tum-ees/pydma.git"
Issues = "https://github.com/tum-ees/pydma/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pydma._version.__version__"}

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
# Not lowered to the 3.10 floor on purpose: current numpy stubs use PEP 695
# `type` statements, which mypy refuses to parse under an older grammar. The
# floor itself is enforced by the tests-minimum CI leg on a real 3.10
# interpreter and by the PEP 695 hygiene check in RELEASING.md.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=pydma --cov-report=term-missing -m 'not scientific'"
markers = [
    "scientific: end-to-end scientific regression tests against golden numbers. Excluded from the default suite; opt-in with `pytest -m scientific`.",
]
